include: lint_options.yaml

analyzer:
  exclude:
    - build/**
    - lib/l10n/intl/**
    - lib/**/generated/**
    - plugins/**
    # Vendored Karing sources are reference-only, not part of the host app.
    - packages/karing/**
    - packages/vpn_service/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
