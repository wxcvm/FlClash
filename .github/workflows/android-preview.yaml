name: Android preview

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        description: Exact source commit for artifact-only builds
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: android-preview
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  RELEASE_TAG: ${{ inputs.release_tag }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  FLCLASH_REQUIRE_RELEASE_SIGNING: 'true'

jobs:
  android:
    if: github.repository == 'wxcvm/FlClash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate build target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true
          add-to-path: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch CA bundle
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Configure Android signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo '::error::Configure the shared Android release signing secrets KEYSTORE, KEY_ALIAS, KEY_PASSWORD and STORE_PASSWORD before publishing.'
            exit 1
          fi
          if ! grep -q FLCLASH_REQUIRE_RELEASE_SIGNING android/app/build.gradle.kts; then
            echo '::error::Historical preview packages cannot be replaced with a different app identity; build a new release instead.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          fingerprint=$(keytool -exportcert -keystore android/app/keystore.jks -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | sha256sum | cut -d' ' -f1)
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "ANDROID_EXPECTED_CERT=$fingerprint" >> "$GITHUB_ENV"
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Set Android preview version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ -preview\.([0-9]+)\.([0-9]+)$ ]]
          run=$((10#${BASH_REMATCH[1]}))
          attempt=$((10#${BASH_REMATCH[2]}))
          test "$attempt" -lt 100
          base=$(sed -n 's/^version: [0-9.]*+\([0-9]*\)$/\1/p' pubspec.yaml)
          [[ "$base" =~ ^[0-9]+$ ]]
          code=$((10#$base + run * 100 + attempt))
          test "$code" -le 2100000000
          echo "ANDROID_PREVIEW_CODE=$code" >> "$GITHUB_ENV"
      - name: Build ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number="$ANDROID_PREVIEW_CODE" --build-name="${RELEASE_TAG#v}" --dart-define=APP_ENV=pre --dart-define=FLCLASH_PREVIEW_TAG="$RELEASE_TAG"
      - name: Verify APK and collect artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          printf '%s\n' "$certs"
          fingerprint=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$fingerprint" =~ ^[0-9a-fA-F]{64}$ ]]
          test "${fingerprint,,}" = "$ANDROID_EXPECTED_CERT"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$aapt"
          badging=$("$aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -E "^package: name='com\.follow\.clash' versionCode='${ANDROID_PREVIEW_CODE}' "
          printf '%s\n' "$badging" | grep -F "versionName='${RELEASE_TAG#v}'"
          mkdir -p preview-assets
          name="FlClash-${RELEASE_TAG#v}-android-arm64-v8a.apk"
          cp "$apk" "preview-assets/$name"
          printf 'Application ID: com.follow.clash; versionCode: %s; shared release signing key; certificate SHA-256: %s.\n' "$ANDROID_PREVIEW_CODE" "$fingerprint" > preview-assets/signing.txt
          jq -n --arg app com.follow.clash --arg cert "${fingerprint,,}" --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" --argjson code "$ANDROID_PREVIEW_CODE" '{applicationId:$app,certificateSha256:$cert,tag:$tag,sourceSha:$sha,versionCode:$code}' > preview-assets/android-build.json
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Android-arm64-preview
          path: preview-assets/*
          if-no-files-found: error
