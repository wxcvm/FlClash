name: Android optional sing-box package
on:
  workflow_dispatch:
  push:
    branches: [feat/android-singbox-package-runtime, feat/android-singbox-core-ui]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'tool/android-singbox/isolation/libbox-src/**'
      - '.github/workflows/android-singbox-package.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'tool/android-singbox/isolation/**'
      - 'test/native_*'
      - '.github/workflows/android-singbox-package.yaml'
concurrency:
  group: singbox-package-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/android-singbox-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Test network epoch state transitions
        run: |
          mkdir -p /tmp/flclash-network-test
          javac --release 8 -d /tmp/flclash-network-test tool/android-singbox/isolation/libbox-src/org/flclash/singboxprobe/isolated/NetworkEpoch.java tool/android-singbox/isolation/tests/NetworkEpochTest.java
          java -cp /tmp/flclash-network-test org.flclash.singboxprobe.isolated.NetworkEpochTest
      - name: Test native config lease
        run: |
          mkdir -p /tmp/flclash-lease-test
          javac --release 8 -d /tmp/flclash-lease-test android/service/src/main/java/com/follow/clash/service/NativeConfigLease.java android/tests/service/NativeConfigLeaseCheck.java
          java -cp /tmp/flclash-lease-test com.follow.clash.service.NativeConfigLeaseCheck
      - name: Obtain verified official ARM64 AAR
        run: |
          gh run download 43219145718 --repo "$GITHUB_REPOSITORY" --name sing-box-v1.14.4-arm64-probe --dir libbox-input
          aar="$(find libbox-input -name libbox.aar -print -quit)"
          hash_file="$(find libbox-input -name sha256.txt -print -quit)"
          test -n "$aar" && test -n "$hash_file"
          test "$(sha256sum "$aar" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$hash_file")"
          echo "LIBBOX_AAR=$(realpath "$aar")" >> "$GITHUB_ENV"
      - name: Install adapter compilation SDK
        run: |
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          "$sdkmanager_path" 'platforms;android-35'
      - name: Build optional production service module
        run: |
          flutter pub get
          cd android
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :service:assembleDebug -Ptarget-platform=android-arm64 -PflclashSingBoxAar="$LIBBOX_AAR"
      - name: Verify service artifact has isolated runtime
        run: |
          aar=$(find build/service/outputs/aar -name '*.aar' -print -quit)
          test -n "$aar"
          unzip -l "$aar" | tee service-aar.txt
          grep -F 'assets/singbox/libbox.dex' service-aar.txt
          grep -F 'jni/arm64-v8a/libbox.so' service-aar.txt
          unzip -p "$aar" classes.jar > service-classes.jar
          jar tf service-classes.jar > service-classes.txt
          if grep -E '^(go/Seq|io/nekohasekai/libbox/)' service-classes.txt; then
            echo 'libbox classes leaked into the host classpath' >&2; exit 1
          fi
      - name: Test native quality ranking
        run: flutter test test/native_quality_ranking_test.dart test/native_auto_recovery_test.dart
      - name: Compile and test actual Android app with native runtime
        run: |
          cd android
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :service:testDebugUnitTest -Ptarget-platform=android-arm64 -PflclashSingBoxAar="$LIBBOX_AAR"
      - name: Verify and upload optional app APK
        run: |
          apk=$(find build/app/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              files = set(apk.namelist())
              for name in ('assets/singbox/libbox.dex', 'lib/arm64-v8a/libbox.so', 'lib/arm64-v8a/libclash.so'):
                  assert name in files, f'missing {name}'
          PY
          mkdir -p native-app-apk
          cp "$apk" native-app-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: flclash-android-singbox-dev
          path: native-app-apk/*.apk
          retention-days: 7
      - name: Verify default build omits runtime
        run: |
          cd android
          ./gradlew :service:assembleDebug -Ptarget-platform=android-arm64
          cd ..
          aar=$(find build/service/outputs/aar -name '*.aar' -print -quit)
          unzip -l "$aar" > service-default-aar.txt
          if grep -E 'assets/singbox/libbox.dex|jni/.*/libbox.so' service-default-aar.txt; then
            echo 'Optional native runtime leaked into default build' >&2; exit 1
          fi
