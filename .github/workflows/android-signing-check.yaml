name: Android release signing check

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-signing-check.yaml'

permissions:
  contents: read

jobs:
  signing:
    if: github.repository == 'wxcvm/FlClash' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify shared release signing key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Android release signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$tmp/release.jks"
          keytool -certreq -keystore "$tmp/release.jks" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -file "$tmp/request.csr"
          test -s "$tmp/request.csr"
          echo 'Shared Android release signing key is usable.'
