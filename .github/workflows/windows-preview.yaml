name: Windows and Android preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-preview.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-preview
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  preview:
    if: github.repository == 'wxcvm/FlClash' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Fetch CA bundle
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Set preview tag
        id: tag
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          tag="v${version}-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "FLCLASH_PREVIEW_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build Windows preview packages
        run: dart setup.dart windows --env pre --targets exe,zip -v
      - name: Verify and hash packages
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.exe','.zip' })
          if (-not ($files | Where-Object Extension -eq '.exe') -or -not ($files | Where-Object Extension -eq '.zip')) {
            throw 'Expected both Windows installer and portable ZIP'
          }
          New-Item -ItemType Directory -Force preview-assets | Out-Null
          foreach ($file in $files) {
            $version = $env:FLCLASH_PREVIEW_TAG.Substring(1)
            $suffix = if ($file.Extension -eq '.exe') { 'windows-amd64-setup.exe' } else { 'windows-amd64.zip' }
            $name = "FlClash-$version-$suffix"
            Copy-Item $file.FullName (Join-Path preview-assets $name)
          }
          Get-ChildItem preview-assets -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content preview-assets/SHA256SUMS -Encoding ascii
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Windows-x64-preview
          path: preview-assets/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$FLCLASH_PREVIEW_TAG"
          cat > preview-notes.md <<'NOTES'
          Windows x64 and Android ARM64 preview of wxcvm/FlClash.

          Includes merged network reconnect, DNS socket recovery, Windows TUN bootstrap, REALITY X25519-MLKEM768 support and native core management changes, including occupied HTTP port rollback.

          Install using the EXE or extract the portable ZIP. SHA256SUMS contains file integrity hashes.

          Includes real download-speed selection. Live connectivity, sleep/resume and throughput still require real-device validation.
          NOTES
          printf '\nSource: %s\n' "$GITHUB_SHA" >> preview-notes.md
          gh release create "$tag" preview-assets/* --target "$GITHUB_SHA" --prerelease --title "FlClash $tag" --notes-file preview-notes.md

  android:
    needs: preview
    uses: ./.github/workflows/android-preview.yaml
    with:
      release_tag: ${{ needs.preview.outputs.release_tag }}
    secrets: inherit
