name: Windows and Android preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after both Windows and Android packages pass
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-preview
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  signing:
    uses: ./.github/workflows/android-signing-check.yaml
    secrets: inherit

  preview:
    needs: signing
    if: github.repository == 'wxcvm/FlClash' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Fetch CA bundle
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Set preview tag
        id: tag
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          tag="v${version}-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "FLCLASH_PREVIEW_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build Windows preview packages
        run: dart setup.dart windows --env pre --targets exe,zip -v
      - name: Collect Windows packages
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.exe','.zip' })
          if (@($files | Where-Object Extension -eq '.exe').Count -ne 1 -or @($files | Where-Object Extension -eq '.zip').Count -ne 1) {
            throw 'Expected both Windows installer and portable ZIP'
          }
          New-Item -ItemType Directory -Force preview-assets | Out-Null
          foreach ($file in $files) {
            $version = $env:FLCLASH_PREVIEW_TAG.Substring(1)
            $suffix = if ($file.Extension -eq '.exe') { 'windows-amd64-setup.exe' } else { 'windows-amd64.zip' }
            $name = "FlClash-$version-$suffix"
            Copy-Item $file.FullName (Join-Path preview-assets $name)
          }
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Windows-x64-preview
          path: preview-assets/*
          if-no-files-found: error
  android:
    needs: preview
    uses: ./.github/workflows/android-preview.yaml
    with:
      release_tag: ${{ needs.preview.outputs.release_tag }}
      source_sha: ${{ github.sha }}
    secrets: inherit

  publish:
    if: inputs.publish
    needs: [preview, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preview.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-Windows-x64-preview
          path: windows-assets
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-Android-arm64-preview
          path: android-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p preview-assets
          for name in "FlClash-$version-windows-amd64-setup.exe" "FlClash-$version-windows-amd64.zip"; do
            test -s "windows-assets/$name"
            cp "windows-assets/$name" preview-assets/
          done
          name="FlClash-$version-android-arm64-v8a.apk"
          test -s "android-assets/$name"
          cp "android-assets/$name" preview-assets/
          test -s android-assets/signing.txt
          (
            cd preview-assets
            sha256sum *.exe *.zip *.apk > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Publish complete dual-platform prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > preview-notes.md <<'NOTES'
          Windows x64 and Android ARM64 preview of wxcvm/FlClash.

          Includes network reconnect and DNS recovery, protocol and native-core enhancements, real download-speed selection, and independent preview updates.

          Install the Windows EXE or extract the portable ZIP. On Android install the ARM64 APK. SHA256SUMS contains all three package hashes.

          Real-device connectivity, sleep/resume and throughput require validation.
          NOTES
          printf '\nSource: %s\n\nAndroid signing: ' "$GITHUB_SHA" >> preview-notes.md
          cat android-assets/signing.txt >> preview-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "FlClash $RELEASE_TAG" --notes-file preview-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" preview-assets/* --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file preview-notes.md
