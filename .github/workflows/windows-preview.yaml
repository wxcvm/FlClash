name: Windows and Android preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after both Windows and Android packages pass
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-preview
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  release-checks:
    if: github.repository == 'wxcvm/FlClash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main CI checks for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yaml/runs" -f branch=main -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100)
          run=$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | max_by(.run_number) // {} | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure")) | .id // empty' <<< "$runs")
          if [[ -z "$run" ]]; then
            echo '::error::The exact main commit must finish its build workflow before packaging.'
            exit 1
          fi
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100")
          # This preview ships Windows and Android only. An unavailable macOS
          # runner must not block those packages; an actual macOS failure still
          # blocks publication, as does any missing or unsuccessful required job.
          jq -e '
            .jobs as $jobs |
            (["Dart","Plugins","Desktop linux","Desktop windows","Go core","Android unit tests","Windows helper test","Rust"] |
              all(.[]; . as $name | any($jobs[]; .name == $name and .status == "completed" and .conclusion == "success"))) and
            any($jobs[]; .name == "Desktop macos" and .status == "completed" and (.conclusion == "success" or .conclusion == "cancelled")) and
            all($jobs[]; .status == "completed" and (.conclusion == "success" or .conclusion == "skipped" or (.name == "Desktop macos" and .conclusion == "cancelled")))
          ' <<< "$jobs" >/dev/null || {
            echo '::error::Required main CI jobs did not all succeed.'
            exit 1
          }
          if jq -e 'any(.jobs[]; .name == "Desktop macos" and .conclusion == "cancelled")' <<< "$jobs" >/dev/null; then
            echo '::warning::macOS build was cancelled; this Windows/Android-only preview does not ship macOS.'
          fi
          echo "Verified main CI run $run for $GITHUB_SHA."
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test APK certificate parsing
        run: bash tool/ci/test-android-cert.sh
      - name: Set shared preview tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          tag="v${version}-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  signing:
    needs: release-checks
    uses: ./.github/workflows/android-signing-check.yaml
    secrets: inherit

  preview:
    needs: [release-checks, signing]
    if: github.repository == 'wxcvm/FlClash' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    env:
      FLCLASH_PREVIEW_TAG: ${{ needs.release-checks.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Apply Mihomo recovery source extension
        shell: bash
        run: python3 tool/mihomo-recovery/apply.py core/Clash.Meta
      - name: Fetch CA bundle
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows preview packages
        run: dart setup.dart windows --env pre --targets exe,zip -v
      - name: Collect Windows packages
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.exe','.zip' })
          if (@($files | Where-Object Extension -eq '.exe').Count -ne 1 -or @($files | Where-Object Extension -eq '.zip').Count -ne 1) {
            throw 'Expected both Windows installer and portable ZIP'
          }
          New-Item -ItemType Directory -Force preview-assets | Out-Null
          foreach ($file in $files) {
            $version = $env:FLCLASH_PREVIEW_TAG.Substring(1)
            $suffix = if ($file.Extension -eq '.exe') { 'windows-amd64-setup.exe' } else { 'windows-amd64.zip' }
            $name = "FlClash-$version-$suffix"
            Copy-Item $file.FullName (Join-Path preview-assets $name)
          }
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Windows-x64-preview
          path: preview-assets/*
          if-no-files-found: error
  android:
    needs: [release-checks, signing]
    uses: ./.github/workflows/android-preview.yaml
    with:
      release_tag: ${{ needs.release-checks.outputs.release_tag }}
      source_sha: ${{ github.sha }}
    secrets: inherit

  publish:
    if: inputs.publish
    needs: [release-checks, preview, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-checks.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-Windows-x64-preview
          path: windows-assets
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-Android-arm64-preview
          path: android-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p preview-assets
          for name in "FlClash-$version-windows-amd64-setup.exe" "FlClash-$version-windows-amd64.zip"; do
            test -s "windows-assets/$name"
            cp "windows-assets/$name" preview-assets/
          done
          name="FlClash-$version-android-arm64-v8a.apk"
          test -s "android-assets/$name"
          cp "android-assets/$name" preview-assets/
          test -s android-assets/signing.txt
          test -s android-assets/android-build.json
          cp android-assets/android-build.json preview-assets/
          (
            cd preview-assets
            sha256sum *.exe *.zip *.apk android-build.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Verify Android upgrade identity against published releases
        shell: bash
        run: |
          set -euo pipefail
          meta=preview-assets/android-build.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" '
            .applicationId == "com.follow.clash" and .tag == $tag and .sourceSha == $sha and
            (.certificateSha256 | test("^[0-9a-f]{64}$")) and
            (.versionCode | type == "number" and . > 0 and . <= 2100000000 and . == floor)
          ' "$meta" >/dev/null
          cert=$(jq -r .certificateSha256 "$meta")
          code=$(jq -r .versionCode "$meta")
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and any(.assets[]; .name | endswith(".apk"))) | .tag_name' > published-tags
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          while IFS= read -r tag; do
            # These two historical releases were explicitly published as
            # com.follow.clash.dev with debug signing, not the shared identity.
            case "$tag" in
              v0.9.3-preview.1.1|v0.9.3-preview.2.1) continue ;;
            esac
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern android-build.json --dir "$tmp" --clobber
            jq -e --arg tag "$tag" --arg cert "$cert" --argjson code "$code" '
              .applicationId == "com.follow.clash" and .tag == $tag and
              .certificateSha256 == $cert and
              (.versionCode | type == "number" and . > 0 and . == floor and . < $code)
            ' "$tmp/android-build.json" >/dev/null || {
              echo "::error::Android signing identity or versionCode conflicts with $tag"
              exit 1
            }
          done < published-tags
      - name: Publish complete dual-platform prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > preview-notes.md <<'NOTES'
          Windows x64 and Android ARM64 preview of wxcvm/FlClash.

          Includes network reconnect and DNS recovery, protocol enhancements, real download-speed selection, background polling and download cancellation, bounded history storage, core memory reclamation, VPN stop cleanup, and streamed subscription processing. Android uses the unified application ID and pinned release certificate.

          Install the Windows EXE or extract the portable ZIP. On Android install the ARM64 APK. SHA256SUMS contains all three package hashes.

          Real-device connectivity, sleep/resume and throughput require validation.
          NOTES
          printf '\nSource: %s\n\nAndroid signing: ' "$GITHUB_SHA" >> preview-notes.md
          cat android-assets/signing.txt >> preview-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "FlClash $RELEASE_TAG" --notes-file preview-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" preview-assets/* --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file preview-notes.md
